[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "solar:0.3.1"
optimizer = true
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fuzz]
runs = 2000

[lint]
# unsafe-typecast: the coders deliberately truncate (e.g. bytes4(checksum), uint8(word)).
# uninitialized-local: `uint256 i;` relies on zero-initialisation by design.
# require-revert-in-loop: false positives on reverts outside loops.
exclude_lints = ["unsafe-typecast", "uninitialized-local", "require-revert-in-loop"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
